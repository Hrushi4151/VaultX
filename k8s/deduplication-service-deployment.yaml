apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultx-deduplication-service
  namespace: vaultx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaultx-deduplication-service
  template:
    metadata:
      labels:
        app: vaultx-deduplication-service
    spec:
      containers:
        - name: deduplication-service
          image: ghcr.io/hrushi4151/vaultx-deduplication-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vaultx-deduplication-service
  namespace: vaultx
spec:
  selector:
    app: vaultx-deduplication-service
  ports:
    - port: 8004
      targetPort: 8004
