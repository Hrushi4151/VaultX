server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vaultx-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vaultx}
    username: ${DB_USERNAME:vaultx}
    password: ${DB_PASSWORD:vaultx_1234}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: VaultXHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

vaultx:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    token-prefix: Bearer
    header-name: Authorization

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:vaultx-documents}

  app:
    version: 1.0.0
    name: VaultX

  pingram:
    api-key: ${PINGRAM_API_KEY}

  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      ocr-model: ${GEMINI_OCR_MODEL:gemini-3.5-flash-lite}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}

    service:
      url: ${AI_SERVICE_URL:http://localhost:8001}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.vaultx: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/vaultx.log