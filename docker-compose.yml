version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultx}
      POSTGRES_USER: ${POSTGRES_USER:-vaultx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultx_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vaultx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultx} -d ${POSTGRES_DB:-vaultx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  vaultx-backend:
    build:
      context: ./vaultx-backend
      dockerfile: Dockerfile
    container_name: vaultx-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vaultx}
      - DB_USERNAME=${POSTGRES_USER:-vaultx}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-vaultx_password}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - FACE_SERVICE_URL=http://vaultx-face-service:8002
      - OCR_SERVICE_URL=http://vaultx-ocr-service:8003
      - DEDUP_SERVICE_URL=http://vaultx-deduplication-service:8004
    depends_on:
      postgres:
        condition: service_healthy
      vaultx-face-service:
        condition: service_started
      vaultx-ocr-service:
        condition: service_started
      vaultx-deduplication-service:
        condition: service_started
    networks:
      - vaultx-network
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  vaultx-frontend:
    build:
      context: ./vaultx-frontend
      dockerfile: Dockerfile
    container_name: vaultx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      vaultx-backend:
        condition: service_healthy
    networks:
      - vaultx-network

  vaultx-face-service:
    build:
      context: ./vaultx-face-service
      dockerfile: Dockerfile
    container_name: vaultx-face-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    networks:
      - vaultx-network

  vaultx-ocr-service:
    build:
      context: ./vaultx-ocr-service
      dockerfile: Dockerfile
    container_name: vaultx-ocr-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    networks:
      - vaultx-network

  vaultx-deduplication-service:
    build:
      context: ./vaultx-deduplication-service
      dockerfile: Dockerfile
    container_name: vaultx-deduplication-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    networks:
      - vaultx-network

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

networks:
  vaultx-network:
    driver: bridge
    name: vaultx-network
