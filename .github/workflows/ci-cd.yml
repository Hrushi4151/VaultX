name: VaultX Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/vaultx

jobs:
  test-and-lint:
    name: 🧪 Test & Lint Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test Spring Boot Backend
        run: |
          cd vaultx-backend
          mvn clean test -DskipTests=false || true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'

      - name: Install Python Dependencies for AI Microservices
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint Face Service
        run: |
          cd vaultx-face-service
          pip install -r requirements.txt
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Lint OCR Service
        run: |
          cd vaultx-ocr-service
          pip install -r requirements.txt
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Lint Deduplication Service
        run: |
          cd vaultx-deduplication-service
          pip install -r requirements.txt
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  build-and-push-docker:
    name: 🐳 Build & Push Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push vaultx-backend
        uses: docker/build-push-action@v5
        with:
          context: ./vaultx-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-backend:${{ github.sha }}

      - name: Build & Push vaultx-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./vaultx-frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:${{ github.sha }}

      - name: Build & Push vaultx-face-service
        uses: docker/build-push-action@v5
        with:
          context: ./vaultx-face-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-face-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-face-service:${{ github.sha }}

      - name: Build & Push vaultx-ocr-service
        uses: docker/build-push-action@v5
        with:
          context: ./vaultx-ocr-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-ocr-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-ocr-service:${{ github.sha }}

      - name: Build & Push vaultx-deduplication-service
        uses: docker/build-push-action@v5
        with:
          context: ./vaultx-deduplication-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-deduplication-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-deduplication-service:${{ github.sha }}

  deploy-kubernetes:
    name: ☸️ Deploy to Kubernetes
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests Syntax
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/configmap-secrets.yaml
          kubectl apply --dry-run=client -f k8s/postgres-deployment.yaml
          kubectl apply --dry-run=client -f k8s/face-service-deployment.yaml
          kubectl apply --dry-run=client -f k8s/ocr-service-deployment.yaml
          kubectl apply --dry-run=client -f k8s/deduplication-service-deployment.yaml
          kubectl apply --dry-run=client -f k8s/backend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/frontend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
